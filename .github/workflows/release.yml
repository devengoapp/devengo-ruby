---
name: release
"on":
  push:
    tags:
      - v*.*.*
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env:
          RELEASE_COMMAND: rake release
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        name: Release Gem
        uses: cadwallion/publish-rubygems-action@94a6f4cd5350581749c569b5001eecc864e3ad0b  # yamllint disable-line rule:line-length
