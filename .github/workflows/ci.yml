---
name: ci
"on":
  pull_request:
  push:
    # Release tags run CI through release.yml.
    branches: ["**"]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Test build (Ruby ${{ matrix.ruby-version }})
    needs: [MarkdownLint, YamlLint, Rubocop, Zizmor]
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Code
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        # yamllint disable-line rule:line-length
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94  # v1.336.0
        with:
          bundler-cache: true
          ruby-version: ${{ matrix.ruby-version }}
      - run: bundle exec rspec
    strategy:
      matrix:
        ruby-version:
          - "3.2"
          - "3.3"
          - "3.4"
          - "4.0"
  MarkdownLint:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Code
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run markdownlint-cli
        # yamllint disable-line rule:line-length
        uses: nosborn/github-action-markdown-cli@508d6cefd8f0cc99eab5d2d4685b1d5f470042c1  # v3.5.0
        with:
          config_file: .markdownlint.yaml
          files: .
  YamlLint:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Code
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: yaml-lint
        # yamllint disable-line rule:line-length
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c  # v3.1.1
        with:
          strict: true
  Zizmor:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Code
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        # yamllint disable-line rule:line-length
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd  # v0.8.1
        with:
          advanced-security: false
  Rubocop:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Code
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        # yamllint disable-line rule:line-length
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94  # v1.336.0
        with:
          bundler-cache: true
      - name: Rubocop
        run: bundle exec rubocop --format progress
